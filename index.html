<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGS アバンダク計算ツール</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        select {
            background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3E%3Cpath stroke='%9ca3af' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3E%3C/svg%3E");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
            padding-right: 2.5rem;
        }

        optgroup {
            background-color: #1e293b;
            color: #38bdf8;
            font-weight: bold;
            font-style: normal;
        }
        option {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 4px;
        }

        body.theme-dark { background-color: #0f172a; color: #f8fafc; }
        .theme-dark .card { background-color: #1e293b; border-color: #334155; }
        .theme-dark select { background-color: #0f172a; color: #f8fafc; border-color: #334155; }
        .theme-dark .field-input { background-color: #0f172a; color: #f8fafc; border-color: #334155; }

        body.theme-light { background-color: #f1f5f9; color: #0f172a; }
        .theme-light .card { background-color: #ffffff; border-color: #e2e8f0; }
        .theme-light select { background-color: #ffffff; color: #0f172a; border-color: #cbd5e1; }
        .theme-light .field-input { background-color: #ffffff; color: #0f172a; border-color: #cbd5e1; }
        .theme-light optgroup { background-color: #e2e8f0; color: #0284c7; }
        .theme-light option { background-color: #ffffff; color: #0f172a; }

        body.theme-cyber { background-color: #0d0e15; color: #00f0ff; }
        .theme-cyber .card { background-color: #1a1c29; border-color: #7000ff; }
        .theme-cyber select { background-color: #0d0e15; color: #00f0ff; border-color: #7000ff; }
        .theme-cyber .field-input { background-color: #0d0e15; color: #00f0ff; border-color: #7000ff; }
        .theme-cyber optgroup { background-color: #2a085c; color: #ff007f; }
        .theme-cyber option { background-color: #0d0e15; color: #00f0ff; }

        body.theme-mint { background-color: #e6f4f1; color: #134e4a; }
        .theme-mint .card { background-color: #ffffff; border-color: #99f6e4; }
        .theme-mint select { background-color: #f0fdfa; color: #134e4a; border-color: #2dd4bf; }
        .theme-mint .field-input { background-color: #f0fdfa; color: #134e4a; border-color: #2dd4bf; }
        .theme-mint optgroup { background-color: #ccfbf1; color: #0d9488; }
        .theme-mint option { background-color: #ffffff; color: #134e4a; }
    </style>
</head>
<body id="app-body" class="theme-dark min-h-screen pb-12 font-sans transition-colors duration-300">

    <header class="card border-b sticky top-0 z-50 shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-2.5 flex justify-between items-center gap-3">
            <h1 class="text-lg md:text-xl font-bold text-cyan-400 flex items-center gap-2">
                <i class="fa-solid fa-calculator"></i> NGS アバンダク計算ツール
            </h1>

            <div class="flex items-center gap-2 text-sm">
                <button id="manage-abilities-btn" class="text-xs bg-cyan-700/40 hover:bg-cyan-600/60 border border-cyan-500/40 px-2.5 py-1.5 rounded transition flex items-center gap-1.5">
                    <i class="fa-solid fa-sliders"></i> <span class="hidden sm:inline">能力管理</span>
                </button>
                <div class="flex items-center gap-1.5">
                    <i class="fa-solid fa-palette text-amber-400"></i>
                    <select id="theme-select" onchange="changeTheme(this.value)" class="text-xs p-1.5 rounded-lg border cursor-pointer">
                        <option value="theme-dark">ダーク</option>
                        <option value="theme-light">ライト</option>
                        <option value="theme-cyber">サイバー</option>
                        <option value="theme-mint">ミント</option>
                    </select>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 mt-4">

        <!-- コンパクトな上部サマリー -->
        <section class="card rounded-xl p-3 md:p-4 border shadow-lg mb-6 grid grid-cols-1 sm:grid-cols-3 gap-3 text-center">
            <div class="bg-black/20 p-2.5 rounded-lg border border-white/10 flex flex-col justify-center">
                <div class="text-[11px] opacity-70 mb-0.5">総特殊能力数 (重複除外)</div>
                <div id="unique-count" class="text-2xl md:text-3xl font-extrabold text-cyan-400">0</div>
            </div>
            <div class="bg-black/20 p-2.5 rounded-lg border border-white/10 flex flex-col justify-center">
                <div class="text-[11px] opacity-70 mb-0.5">選択済みスロット</div>
                <div id="filled-slots" class="text-2xl md:text-3xl font-extrabold text-emerald-400">0 / 32</div>
            </div>
            <div class="bg-black/20 p-2.5 rounded-lg border border-white/10 flex items-center justify-center">
                <button id="reset-all-btn" class="w-full h-full min-h-[42px] bg-red-600/20 hover:bg-red-600/40 text-red-400 font-semibold py-2 px-3 rounded-lg border border-red-500/30 transition flex items-center justify-center gap-2 text-xs md:text-sm">
                    <i class="fa-solid fa-trash-can"></i>
                    <span>全選択リセット</span>
                </button>
            </div>
            <div class="sm:col-span-3 bg-black/20 p-2.5 rounded-lg border border-white/10 text-left">
                <div class="text-[11px] opacity-70 mb-1">数値合算 (全装備ぶんの累計・S は原種と同数値 / MNS は MN と同数値 / EXⅢ は「EXⅢ 手動入力」から計上)</div>
                <div id="stat-totals" class="flex flex-wrap gap-1.5 text-xs font-semibold text-cyan-200 text-left"><span class="opacity-50 text-xs">未選択</span></div>
            </div>
        </section>

        <!-- トースト通知 -->
        <div id="toast-message" class="fixed bottom-5 right-5 bg-cyan-600 text-white px-4 py-2 rounded-lg shadow-xl text-xs font-semibold opacity-0 transition-opacity duration-300 pointer-events-none z-50"></div>

        <div id="equipment-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Dynamic JavaScript Content -->
        </div>

    </main>

    <!-- 能力データ管理モーダル -->
    <div id="ability-modal" class="hidden fixed inset-0 z-[60] bg-black/60 flex items-center justify-center p-4" onclick="if(event.target===this)closeManageModal()">
        <div class="card rounded-xl border shadow-2xl w-full max-w-lg max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center p-4 border-b border-white/10">
                <h2 class="font-bold text-cyan-400 flex items-center gap-2">
                    <i class="fa-solid fa-sliders"></i> カスタム能力管理
                </h2>
                <button onclick="closeManageModal()" class="w-8 h-8 rounded-lg bg-red-600/20 hover:bg-red-600/40 text-red-300 border border-red-500/30 transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="p-4 space-y-4 overflow-y-auto">
                <!-- 追加フォーム -->
                <div class="bg-black/20 p-3 rounded-lg border border-white/10 space-y-2">
                    <label class="text-xs opacity-70 block">カテゴリ (既存から選択 or 新規入力)</label>
                    <input id="custom-category-input" list="category-list" type="text" class="field-input w-full rounded-lg text-sm p-2 border" placeholder="例: ユディ:ダホウ / 新カテゴリ名">
                    <datalist id="category-list"></datalist>

                    <label class="text-xs opacity-70 block">能力名</label>
                    <input id="custom-ability-input" type="text" class="field-input w-full rounded-lg text-sm p-2 border" placeholder="例: ユディ･ネクストダホウ">

                    <button onclick="addCustomAbility()" class="w-full bg-cyan-700/40 hover:bg-cyan-600/60 border border-cyan-500/40 font-semibold py-2 rounded-lg transition text-sm flex items-center justify-center gap-2">
                        <i class="fa-solid fa-plus"></i> 追加
                    </button>
                </div>

                <!-- 登録済みカスタム能力 -->
                <div>
                    <div class="text-xs opacity-70 mb-2">カスタム登録済み (× で削除)</div>
                    <div id="custom-list" class="space-y-2 text-xs"></div>
                </div>

                <!-- バックアップ -->
                <div class="bg-black/20 p-3 rounded-lg border border-white/10 space-y-2">
                    <div class="text-xs opacity-70">バックアップ (JSON) — 他PCへの移行・共有に</div>
                    <textarea id="custom-json" class="field-input w-full rounded-lg text-xs p-2 border h-24 font-mono" placeholder="エクスポートでJSON出力 / 貼り付けてインポート"></textarea>
                    <div class="flex gap-2">
                        <button onclick="exportCustomData()" class="flex-1 bg-emerald-600/20 hover:bg-emerald-600/40 text-emerald-300 border border-emerald-500/30 py-1.5 rounded text-xs transition flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-download"></i> エクスポート
                        </button>
                        <button onclick="importCustomData()" class="flex-1 bg-amber-600/20 hover:bg-amber-600/40 text-amber-300 border border-amber-500/30 py-1.5 rounded text-xs transition flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-upload"></i> インポート
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // ▼ 特殊能力データ (ここを編集して能力を追加/変更できます)
        //    形式: { category: "カテゴリ名", items: ["能力名A", "能力名B", ...] }
        //
        //    ・新しい能力を追加する場合は、該当カテゴリの items に "能力名" を追記
        //    ・カテゴリ自体を追加する場合は 1 行まるごとコピーして書き換え
        //    ・※ 選択状態は「能力名」で保存されるため、既存の名前を変更すると
        //       過去に選んでいたスロットが未選択に戻ります
        //    ・※ コードを触りたくない場合は、画面右上の「能力管理」から
        //       ブラウザ上で追加/削除もできます (localStorage に保存)
        // ============================================================
        const DEFAULT_ABILITY_DATA = [
            { category: "ハルフィリニア", items: ["エミスハルフィニア", "エミスハルフィニアS", "エミスハルフィニアMN", "エミスハルフィニアMNS", "アトスハルフィニア", "ロイスハルフィニア", "ロイスハルフィニアS"] },
            { category: "ドレド･キーパ", items: ["アトスドレド・キーパ", "エルガドレド・キーパ", "エルガドレド・キーパMN", "エルガドレド・キーパMNS"] },
            { category: "ドミナ", items: ["テルフィア･ドミナ", "テルフィア･ドミナMN", "テルフィア･ドミナMNS", "テルフィア･ドミナLC"] },
            { category: "ソール", items: ["アトスグラディエ･ソール", "エルガグラディエ･ソール", "エルガグラディエ･ソールS", "エルガグラディエ･ソールMN", "エルガグラディエ･ソールMNS"] },
            { category: "マエスティ", items: ["エミスギガス･マエスティ", "アトスギガス･マエスティ", "エルガギガス･マエスティMN", "エルガギガス･マエスティ", "エルガギガス･マエスティMNS"] },
            { category: "ドライエル", items: ["ペタ･ドライエル", "ペタ･ドライエルS", "ペタ･ドライエルMN", "ペタ･ドライエルMNS", "ペタ･ドライエルLC"] },
            { category: "ユディ:パルフト", items: ["ユディ･アムパルフト", "ユディ･ガーディパルフト", "ユディ･スタパルフト", "ユディ･スタピパルフト", "ユディ･スピパルフト", "ユディ･レジパルフト"] },
            { category: "ユディ:ダシャ", items: ["ユディ･アムダシャ", "ユディ･ガディダシャ", "ユディ･スタダシャ", "ユディ･スタピダシャ", "ユディ･スピダシャ", "ユディ･レジダシャ"] },
            { category: "ユディ:ダホウ", items: ["ユディ･アムダホウ", "ユディ･ガディダホウ", "ユディ･スタダホウ", "ユディ･スタピダホウ", "ユディ･スピダホウ", "ユディ･レジダホウ"] },
            { category: "ユディ:シャホウ", items: ["ユディ･アムシャホウ", "ユディ･ガディシャホウ", "ユディ･スタシャホウ", "ユディ･スタピシャホウ", "ユディ･スピシャホウ", "ユディ･レジシャホウ"] },
            { category: "ユーゼ:パルフト", items: ["ユーゼ･アムパルフト", "ユーゼ･ガーディパルフト", "ユーゼ･スタパルフト", "ユーゼ･スタピパルフト", "ユーゼ･スピパルフト", "ユーゼ･レジパルフト"] },
            { category: "ユーゼ:ダシャ", items: ["ユーゼ･アムダシャ", "ユーゼ･ガディダシャ", "ユーゼ･スタダシャ", "ユーゼ･スタピダシャ", "ユーゼ･スピダシャ", "ユーゼ･レジダシャ"] },
            { category: "ユーゼ:ダホウ", items: ["ユーゼ･アムダホウ", "ユーゼ･ガディダホウ", "ユーゼ･スタダホウ", "ユーゼ･スタピダホウ", "ユーゼ･スピダホウ", "ユーゼ･レジダホウ"] },
            { category: "ユーゼ:シャホウ", items: ["ユーゼ･アムシャホウ", "ユーゼ･ガディシャホウ", "ユーゼ･スタシャホウ", "ユーゼ･スタピシャホウ", "ユーゼ･スピシャホウ", "ユーゼ･レジシャホウ"] },
            { category: "ラディ:パルフト", items: ["ラディ･アムパルフト", "ラディ･ガーディパルフト", "ラディ･スタパルフト", "ラディ･スタピパルフト", "ラディ･スピパルフト", "ラディ･レジパルフト"] },
            { category: "ラディ:ダシャ", items: ["ラディ･アムダシャ", "ラディ･ガディダシャ", "ラディ･スタダシャ", "ラディ･スタピダシャ", "ラディ･スピダシャ", "ラディ･レジダシャ"] },
            { category: "ラディ:ダホウ", items: ["ラディ･アムダホウ", "ラディ･ガディダホウ", "ラディ･スタダホウ", "ラディ･スタピダホウ", "ラディ･スピダホウ", "ラディ･レジダホウ"] },
            { category: "ラディ:シャホウ", items: ["ラディ･アムシャホウ", "ラディ･ガディシャホウ", "ラディ･スタシャホウ", "ラディ･スタピシャホウ", "ラディ･スピシャホウ", "ラディ･レジシャホウ"] },
            { category: "ラーゼ:パルフト", items: ["ラーゼ･アムパルフト", "ラーゼ･ガーディパルフト", "ラーゼ･スタパルフト", "ラーゼ･スタピパルフト", "ラーゼ･スピパルフト", "ラーゼ･レジパルフト"] },
            { category: "ラーゼ:ダシャ", items: ["ラーゼ･アムダシャ", "ラーゼ･ガディダシャ", "ラーゼ･スタダシャ", "ラーゼ･スタピダシャ", "ラーゼ･スピダシャ", "ラーゼ･レジダシャ"] },
            { category: "ラーゼ:ダホウ", items: ["ラーゼ･アムダホウ", "ラーゼ･ガディダホウ", "ラーゼ･スタダホウ", "ラーゼ･スタピダホウ", "ラーゼ･スピダホウ", "ラーゼ･レジダホウ"] },
            { category: "ラーゼ:シャホウ", items: ["ラーゼ･アムシャホウ", "ラーゼ･ガディシャホウ", "ラーゼ･スタシャホウ", "ラーゼ･スタピシャホウ", "ラーゼ･スピシャホウ", "ラーゼ･レジシャホウ"] },
            { category: "EXOP", items: ["EXOP1", "EXOP2", "EXOP3"] }
        ];


        // ============================================================
        // ▼ 能力ごとの数値効果 (上のサマリーの「数値合算」で使用)
        //    出典: swiki「特殊能力」ページの数値表 (2026/09/16 時点を基に作成)
        //    ・数値は装備 1 点ぶん。選択した全スロットぶん合算してサマリーに表示する
        //    ・HP / PP は絶対値、威力 / 打撃 / 射撃 / 法撃 / 下限 / クリ / ダ耐 / 状態 / 環境 は % 表記
        //    ・「S」は原種と同じ数値、「MNS」は「MN」と同じ数値として計上
        //    ・EXOP1〜3 は種類数のみ計上。EXⅢ の数値は「EXⅢ 手動入力」で
        //      共通威力 (6.0/6.25/6.5% ×3枠) と型ロール (H/P/X/D/R/A) を加算
        //    ・数値未収録の「エミスギガス･マエスティ」とカスタム能力は未登録 (集計から除外される)
        //    ・※ 既存の能力名を変更すると選択状態が復元できなくなるため、キーは能力名そのまま
        // ============================================================
        const ABILITY_STATS = {
            "エミスハルフィニア": { HP: 40, PP: 8, 威力: 7 },
            "エミスハルフィニアS": { HP: 40, PP: 8, 威力: 7 },
            "エミスハルフィニアMN": { PP: 4, 威力: 7 },
            "エミスハルフィニアMNS": { PP: 4, 威力: 7 },
            "アトスハルフィニア": { HP: 15, PP: 10, 威力: 6 },
            "ロイスハルフィニア": { HP: 35, PP: 7, 威力: 6 },
            "ロイスハルフィニアS": { HP: 35, PP: 7, 威力: 6 },
            "アトスドレド・キーパ": { HP: 90, 威力: 3.75, 下限: 7, ダ耐: 1 },
            "エルガドレド・キーパ": { HP: 50, PP: 5, 威力: 3.75, 下限: 7, ダ耐: 1 },
            "エルガドレド・キーパMN": { HP: 10, PP: 1, 威力: 3.75, 下限: 7, ダ耐: 1 },
            "エルガドレド・キーパMNS": { HP: 10, PP: 1, 威力: 3.75, 下限: 7, ダ耐: 1 },
            "テルフィア･ドミナ": { HP: 45, PP: 6, 威力: 5, 下限: 3 },
            "テルフィア･ドミナMN": { HP: 5, PP: 2, 威力: 5, 下限: 3 },
            "テルフィア･ドミナMNS": { HP: 5, PP: 2, 威力: 5, 下限: 3 },
            "テルフィア･ドミナLC": { HP: 45, PP: 6, 威力: 4.75, 下限: 3 },
            "アトスグラディエ･ソール": { HP: 50, PP: 5, 威力: 5.75 },
            "エルガグラディエ･ソール": { HP: 30, PP: 8, 威力: 5.75 },
            "エルガグラディエ･ソールS": { HP: 30, PP: 8, 威力: 5.75 },
            "エルガグラディエ･ソールMN": { HP: -10, PP: 4, 威力: 5.75 },
            "エルガグラディエ･ソールMNS": { HP: -10, PP: 4, 威力: 5.75 },
            "アトスギガス･マエスティ": { PP: 5, 威力: 5.75 },
            "エルガギガス･マエスティ": { HP: 40, 威力: 5.75 },
            // ※「アトスギガス･マエスティMN」は実在しないため「エルガギガス･マエスティMN」に修正 (swiki 一覧比較表)
            "エルガギガス･マエスティMN": { PP: -4, 威力: 5.75 },
            "エルガギガス･マエスティMNS": { PP: -4, 威力: 5.75 },
            "ペタ･ドライエル": { PP: 5, 威力: 6.5, ダ耐: 1, 状態: 5 },
            "ペタ･ドライエルS": { PP: 5, 威力: 6.5, ダ耐: 1, 状態: 5 },
            "ペタ･ドライエルMN": { HP: -40, PP: 1, 威力: 6.5, ダ耐: 1, 状態: 5 },
            "ペタ･ドライエルMNS": { HP: -40, PP: 1, 威力: 6.5, ダ耐: 1, 状態: 5 },
            "ペタ･ドライエルLC": { PP: 5, 威力: 6.25, ダ耐: 1, 状態: 5 },
            "ユディ･アムパルフト": { 威力: 7, 下限: 4.5 },
            "ユディ･ガーディパルフト": { 威力: 7, 下限: 3.5, ダ耐: 2.5 },
            "ユディ･スタパルフト": { HP: 20, 威力: 7, 下限: 3.5 },
            "ユディ･スタピパルフト": { HP: 10, PP: 3, 威力: 7, 下限: 3.5 },

        // ---------- ユーティリティ ----------
        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        }

        function showToast(msg) {
            const toast = document.getElementById("toast-message");
            toast.textContent = msg;
            toast.classList.remove("opacity-0");
            toast.classList.add("opacity-100");
            setTimeout(() => {
                toast.classList.remove("opacity-100");
                toast.classList.add("opacity-0");
            }, 2000);
        }

        // ---------- テーマ ----------
        function changeTheme(themeClass) {
            document.getElementById("app-body").className = `${themeClass} min-h-screen pb-12 font-sans transition-colors duration-300`;
            try {
                localStorage.setItem(THEME_KEY, themeClass);
            } catch (e) {}
        }

        function restoreTheme() {
            try {
                const saved = localStorage.getItem(THEME_KEY);
                if (saved) changeTheme(saved);
            } catch (e) {}
        }

        // ---------- カスタム能力データ ----------
        function loadCustomData() {
            try {
                const saved = localStorage.getItem(CUSTOM_DATA_KEY);
                const parsed = saved ? JSON.parse(saved) : [];
                if (Array.isArray(parsed)) {
                    customData = parsed.filter(g =>
                        g && typeof g.category === "string" &&
                        Array.isArray(g.items) && g.items.every(i => typeof i === "string")
                    );
                }
            } catch (e) {
                customData = [];
            }
        }

        function saveCustomData() {
            try {
                localStorage.setItem(CUSTOM_DATA_KEY, JSON.stringify(customData));
            } catch (e) {}
            refreshSelectOptions();
        }

        // デフォルト + カスタム をマージ (同カテゴリ名は統合・重複排除)
        function getAllData() {
            const merged = masterData.map(g => ({ category: g.category, items: [...g.items] }));
            customData.forEach(cg => {
                const existing = merged.find(g => g.category === cg.category);
                if (existing) {
                    cg.items.forEach(it => {
                        if (!existing.items.includes(it)) existing.items.push(it);
                    });
                } else {
                    merged.push({ category: cg.category, items: [...cg.items] });
                }
            });
            return merged;
        }

        function addCustomAbility() {
            const cat = document.getElementById("custom-category-input").value.trim();
            const name = document.getElementById("custom-ability-input").value.trim();
            if (!cat || !name) {
                showToast("カテゴリと能力名を両方入力してください");
                return;
            }
            const all = getAllData();
            const g = all.find(x => x.category === cat);
            if (g && g.items.includes(name)) {
                showToast("その能力は既に存在します");
                return;
            }
            let cg = customData.find(x => x.category === cat);
            if (!cg) {
                cg = { category: cat, items: [] };
                customData.push(cg);
            }
            cg.items.push(name);
            saveCustomData();
            document.getElementById("custom-ability-input").value = "";
            showToast(`「${name}」を追加しました`);
        }

        function deleteCustomAbility(cat, item) {
            const cg = customData.find(x => x.category === cat);
            if (!cg) return;
            cg.items = cg.items.filter(i => i !== item);
            if (!cg.items.length) {
                customData = customData.filter(x => x !== cg);
            }
            saveCustomData();
            renderModalData();
            showToast(`「${item}」を削除しました`);
        }

        function exportCustomData() {
            document.getElementById("custom-json").value = JSON.stringify(customData, null, 2);
            showToast("JSONをテキスト欄に出力しました");
        }

        function importCustomData() {
            const raw = document.getElementById("custom-json").value.trim();
            if (!raw) {
                showToast("JSONを貼り付けてください");
                return;
            }
            try {
                let parsed = JSON.parse(raw);
                if (!Array.isArray(parsed) && parsed && Array.isArray(parsed.data)) parsed = parsed.data;
                const valid = parsed.filter(g =>
                    g && typeof g.category === "string" &&
                    Array.isArray(g.items) && g.items.every(i => typeof i === "string")
                );
                if (!valid.length) throw new Error("format");
                let added = 0;
                valid.forEach(cg => {
                    let target = customData.find(x => x.category === cg.category);
                    if (!target) {
                        target = { category: cg.category, items: [] };
                        customData.push(target);
                    }
                    cg.items.forEach(it => {
                        if (!target.items.includes(it)) {
                            target.items.push(it);
                            added++;
                        }
                    });
                });
                saveCustomData();
                renderModalData();
                showToast(`${added}件のカスタム能力をインポートしました`);
            } catch (e) {
                showToast("JSONの形式が正しくありません");
            }
        }

                                    <div>
                                        <label class="text-[10px] opacity-70 block mb-0.5">Ⅲ共通威力 (3枠ぶん)</label>
                                        <select id="${eq.id}-expower" onchange="calculateSummary()" class="ability-select w-full rounded-lg text-xs p-1.5 focus:ring-1 focus:ring-cyan-500 appearance-none cursor-pointer">
                                            <option value="">未選択</option>
                                            <option value="6">威力+6.0%</option>
                                            <option value="6.25">威力+6.25%</option>
                                            <option value="6.5">威力+6.5%</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="text-[10px] opacity-70 block mb-0.5">型ロール (EX枠1〜3)</label>
                                        <div class="grid grid-cols-3 gap-1">
                                            ${[0, 1, 2].map(i => `
                                            <select id="${eq.id}-extype-${i}" onchange="calculateSummary()" class="ability-select w-full rounded-lg text-xs p-1.5 focus:ring-1 focus:ring-cyan-500 appearance-none cursor-pointer">
                                                <option value="">-</option>
                                                <option value="H">H · HP+25</option>
                                                <option value="P">P · PP+3</option>
                                                <option value="X">X · HP15 PP2</option>
                                                <option value="D">D · ダ耐+1%</option>
                                                <option value="R">R · 全ダウン耐+5%</option>
                                                <option value="A">A · HP25 PP3</option>
                                            </select>`).join('')}
                                        </div>
                                    </div>
                                </div>
                                <div class="text-[10px] opacity-60 mt-1.5">威力下限補正+2% は3枠ぶん自動加算。種類数のカウントは「EXOP1~3 自動入力」と併用してください</div>
                            </div>
                        </div>
                        ` : `
                        <div class="mb-4 h-[84px]"></div>
                        `}

                        <div class="space-y-2">
                            ${Array.from({ length: 8 }).map((_, i) => `
                                <div class="flex items-center gap-2">
                                    <span class="text-xs font-semibold opacity-60 w-5 text-right">${i + 1}</span>
                                    <select id="${eq.id}-slot-${i}" onchange="calculateSummary()" class="ability-select w-full rounded-lg text-xs md:text-sm p-2 focus:ring-1 focus:ring-cyan-500 appearance-none cursor-pointer">
                                        ${optionsHTML}
                                    </select>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // データ変更後に全セレクトを張り直す (選択値は可能な限り維持)
        function refreshSelectOptions() {
            const optionsHTML = buildOptionsHTML();
            let lost = false;
            EQUIPMENTS.forEach(eq => {
                for (let i = 0; i < 8; i++) {
                    const select = document.getElementById(`${eq.id}-slot-${i}`);
                    if (!select) continue;
                    const current = select.value;
                    select.innerHTML = optionsHTML;
                    select.value = current;
                    if (current && select.value !== current) lost = true;
                }
            });
            calculateSummary();
            if (lost) showToast("削除された能力の選択を未選択にしました");
        }

        // ---------- 操作 ----------
        function toggleExop(enabled) {
            const exops = ["EXOP1", "EXOP2", "EXOP3"];
            exops.forEach((exop, idx) => {
                const select = document.getElementById(`weapon-slot-${idx}`);
                if (select) {
                    if (enabled) select.value = exop;
                    else if (select.value === exop) select.value = "";
                }
            });
            calculateSummary();
        }

        function syncExopToggle() {
            const toggle = document.getElementById("exop-toggle");
            if (!toggle) return;
            const exops = ["EXOP1", "EXOP2", "EXOP3"];
            let matched = true;
            exops.forEach((exop, idx) => {
                const select = document.getElementById(`weapon-slot-${idx}`);
                if (!select || select.value !== exop) matched = false;
            });
            toggle.checked = matched;
        }

        // EXⅢ 手動入力パネルの開閉
        function toggleExManual(eqId, enabled) {
            const grid = document.getElementById(`${eqId}-exmanual-grid`);
            if (grid) grid.classList.toggle("hidden", !enabled);
            calculateSummary();
        }

        function clearEquipment(eqId) {
            for (let i = 0; i < 8; i++) {
                const select = document.getElementById(`${eqId}-slot-${i}`);
                if (select) select.value = "";
            }
            // EXⅢ 手動入力もリセット
            const man = document.getElementById(`${eqId}-exmanual-on`);
            if (man) {
                man.checked = false;
                const grid = document.getElementById(`${eqId}-exmanual-grid`);
                if (grid) grid.classList.add("hidden");
                const power = document.getElementById(`${eqId}-expower`);
                if (power) power.value = "";
                for (let i = 0; i < 3; i++) {
                    const ts = document.getElementById(`${eqId}-extype-${i}`);
                    if (ts) ts.value = "";
                }
            }
            calculateSummary();
        }

        function copyToAll(srcEqId) {
            const srcValues = [];
            for (let i = 0; i < 8; i++) {
                srcValues.push(document.getElementById(`${srcEqId}-slot-${i}`).value);
            }

            EQUIPMENTS.forEach(eq => {
                if (eq.id !== srcEqId) {
                    for (let i = 0; i < 8; i++) {
                        const select = document.getElementById(`${eq.id}-slot-${i}`);
                        if (select) select.value = srcValues[i];
                    }
                }
            });
            calculateSummary();
        }

        function getCurrentState() {
            const state = {};
            EQUIPMENTS.forEach(eq => {
                state[eq.id] = [];
                for (let i = 0; i < 8; i++) {
                    const select = document.getElementById(`${eq.id}-slot-${i}`);
                    state[eq.id].push(select ? select.value : "");
                }
                // EXⅢ 手動入力の状態も保存
                const on = document.getElementById(`${eq.id}-exmanual-on`);
                if (on) {
                    state[`${eq.id}#ex`] = {
                        on: on.checked,
                        power: document.getElementById(`${eq.id}-expower`).value,
                        types: [0, 1, 2].map(i => document.getElementById(`${eq.id}-extype-${i}`).value)
                    };
                }
            });
            return state;
        }

        function applyState(state) {
            if (!state) return;
            EQUIPMENTS.forEach(eq => {
                if (state[eq.id]) {
                    for (let i = 0; i < 8; i++) {
                        const select = document.getElementById(`${eq.id}-slot-${i}`);
                        if (select) select.value = state[eq.id][i] || "";
                    }
                }
                // EXⅢ 手動入力の復元
                const ex = state[`${eq.id}#ex`];
                if (ex) {
                    const on = document.getElementById(`${eq.id}-exmanual-on`);
                    const grid = document.getElementById(`${eq.id}-exmanual-grid`);
                    const power = document.getElementById(`${eq.id}-expower`);
                    if (on) on.checked = !!ex.on;
                    if (grid) grid.classList.toggle("hidden", !on || !on.checked);
                    if (power && ex.power) power.value = ex.power;
                    if (ex.types) {
                        ex.types.forEach((v, i) => {
                            const ts = document.getElementById(`${eq.id}-extype-${i}`);
                            if (ts) ts.value = v || "";
                        });
                    }
                }
            });
            calculateSummary();
        }

        function calculateSummary() {
            const uniqueAbilities = new Set();
            const statTotals = {};
            let filledCount = 0;

            EQUIPMENTS.forEach(eq => {
                for (let i = 0; i < 8; i++) {
                    const select = document.getElementById(`${eq.id}-slot-${i}`);
                    if (select && select.value) {
                        filledCount++;
                        uniqueAbilities.add(select.value);
                        // 数値合算 (装備 1 点ぶんの効果を加算していく)
                        const st = ABILITY_STATS[select.value];
                        if (st) {
                            for (const k in st) statTotals[k] = (statTotals[k] || 0) + st[k];
                        }
                    }
                }
            });

            // EXⅢ 手動入力 (武器ごと: 共通威力×3枠 + 下限+2%×3枠 + 型ロールぶん)
            EQUIPMENTS.forEach(eq => {
                const on = document.getElementById(`${eq.id}-exmanual-on`);
                if (!on || !on.checked) return;
                const pow = parseFloat(document.getElementById(`${eq.id}-expower`).value) || 0;
                if (pow) statTotals["威力"] = (statTotals["威力"] || 0) + pow * 3;
                statTotals["下限"] = (statTotals["下限"] || 0) + 6; // 下限+2% ×3枠
                for (let i = 0; i < 3; i++) {
                    const ts = document.getElementById(`${eq.id}-extype-${i}`);
                    const bt = ts && ts.value ? EXOP_TYPE_STATS[ts.value] : null;
                    if (bt) for (const k in bt) statTotals[k] = (statTotals[k] || 0) + bt[k];
                }
            });

            document.getElementById("unique-count").textContent = uniqueAbilities.size;
            document.getElementById("filled-slots").textContent = `${filledCount} / 32`;
            renderStatTotals(statTotals);

            syncExopToggle();

            // 自動保存 (ローカルストレージ)
            try {
                localStorage.setItem("ngs_calc_autosave", JSON.stringify(getCurrentState()));
            } catch (e) {}
        }

        function renderStatTotals(totals) {
            const el = document.getElementById("stat-totals");
            if (!el) return;
            const chips = STAT_LABELS.filter(([k]) => totals[k]).map(([k, unit]) => {
                const v = totals[k];
                const shown = Number.isInteger(v) ? v : Math.round(v * 100) / 100;
                const val = `${shown > 0 ? "+" : ""}${shown}${unit}`;
                const neg = shown < 0 ? " text-rose-300" : " text-cyan-300";
                return `<span class="stat-chip bg-white/5 border border-white/10 rounded px-1.5 py-0.5"><span class="opacity-70">${k}</span> <b${neg}>${val}</b></span>`;
            });
            el.innerHTML = chips.length
                ? chips.join("")
                : `<span class="opacity-50 text-xs">数値データ未登録の能力のみ (EXOP1〜3 など)</span>`;
        }

        function restoreAutoSave() {
            try {
                const saved = localStorage.getItem("ngs_calc_autosave");
                if (saved) {
                    applyState(JSON.parse(saved));
                }
            } catch (e) {}
        }

        function bindGlobalEvents() {
            document.getElementById("reset-all-btn").addEventListener("click", () => {
                EQUIPMENTS.forEach(eq => clearEquipment(eq.id));
                showToast("全選択をリセットしました");
            });

            document.getElementById("manage-abilities-btn").addEventListener("click", openManageModal);
        }
    </script>
</body>
</html>
